name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet; skipping build/test."; fi
      - if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.detect.outputs.has_app == 'true'
        run: npm ci
      - if: steps.detect.outputs.has_app == 'true'
        run: npm test
      - if: steps.detect.outputs.has_app == 'true'
        run: npm run build
